[project]
name = "open-webui"
description = "Open WebUI"
authors = [
    { name = "Timothy Jaeryang Baek", email = "tim@openwebui.com" }
]
license = { file = "LICENSE" }
dependencies = [
    # Core web framework
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.12.5",
    "python-multipart==0.0.22",
    "itsdangerous==2.2.0",

    # WebSocket & Auth
    "python-socketio==5.16.1",
    "python-jose==3.5.0",
    "cryptography",
    "bcrypt==5.0.0",
    "argon2-cffi==25.1.0",
    "PyJWT[crypto]==2.11.0",
    "authlib==1.6.9",

    # HTTP clients
    "requests==2.32.5",
    "aiohttp==3.13.2", # do not update to 3.13.3 - broken
    "async-timeout",
    "aiocache",
    "aiofiles",
    "starlette-compress==1.7.0",
    "Brotli==1.1.0",
    "httpx[socks,http2,zstd,brotli]==0.28.1",
    "starsessions[redis]==2.2.1",
    "python-mimeparse==2.0.0",

    # Database (PostgreSQL)
    "sqlalchemy==2.0.48",
    "alembic==1.18.4",
    "peewee==3.19.0",
    "peewee-migrate==1.14.3",
    "psycopg2-binary==2.9.11",

    # Collaboration
    "pycrdt==0.12.47",
    "redis",

    # Scheduling & security
    "pytz==2026.1.post1",
    "APScheduler==3.11.2",
    "RestrictedPython==8.1",

    # Logging
    "loguru==0.7.3",
    "asgiref==3.11.1",

    # AI (remote API only)
    "tiktoken",
    "openai",

    # RAG framework (needed by OpenWebUI internals)
    "langchain==1.2.10",
    "langchain-community==0.4.1",
    "langchain-classic==1.0.1",
    "langchain-text-splitters==1.1.1",

    # Vector DB (default)
    "chromadb==1.5.2",
    "fake-useragent==2.2.0",

    # Document parsing (minimal set)
    "ftfy==6.3.1",
    "chardet==5.2.0",
    "pypdf==6.7.5",
    "fpdf2==2.8.7",
    "pymdown-extensions==10.21",
    "Markdown==3.10.2",
    "validators==0.35.0",
    "psutil",
    "pillow==12.1.1",

    # Code formatting (used by UI code editor)
    "black==26.1.0",

    # Search
    "rank-bm25==0.2.2",
    "pydub",
    "ddgs==9.11.2",

    # Database extras
    "PyMySQL==1.1.2",
]
readme = "README.md"
requires-python = ">= 3.11, < 3.13.0a1"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary==2.9.11",
    "pgvector==0.4.2",
]
mariadb = [
    "mariadb==1.1.14",
]

all = [
    "pymongo",
    "psycopg2-binary==2.9.11",
    "pgvector==0.4.2",
    "mariadb==1.1.14",
    "moto[s3]>=5.0.26",
    "gcp-storage-emulator>=2024.8.3",
    "docker~=7.1.0",
    "pytest~=8.3.2",
    "pytest-docker~=3.2.5",
    "playwright==1.58.0", # Caution: version must match docker-compose.playwright.yaml - Update the docker-compose.yaml if necessary
    "elasticsearch==9.3.0",

    "qdrant-client==1.17.0",
    
    "weaviate-client==4.20.3",
    "pymilvus==2.6.9",
    "pinecone==6.0.2",
    "oracledb==3.4.2",
    "colbert-ai==0.2.22",

    "firecrawl-py==4.18.0",
    "azure-search-documents==11.6.0",
]

[project.scripts]
open-webui = "open_webui:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "package.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.hooks.custom]  # keep this for reading hooks from `hatch_build.py`

[tool.hatch.build.targets.wheel]
sources = ["backend"]
exclude = [
    ".dockerignore",
    ".gitignore",
    ".webui_secret_key",
    "dev.sh",
    "requirements.txt",
    "start.sh",
    "start_windows.bat",
    "webui.db",
    "chroma.sqlite3",
]
force-include = { "CHANGELOG.md" = "open_webui/CHANGELOG.md", build = "open_webui/frontend" }

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,package-lock.json,i18n,*.lock,*.css,*-bundle.js,locales,example-doc.txt,emoji-shortcodes.json'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'ans'

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
]
